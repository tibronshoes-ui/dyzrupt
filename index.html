<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYZRUPT - Audio Mutation Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            zinc: {
              950: '#09090b',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-black text-zinc-100 min-h-screen font-sans flex flex-col justify-between p-4 max-w-md mx-auto">

  <!-- Header / Top Bar -->
  <header class="flex justify-between items-center py-3 border-b border-zinc-800/80 mb-4">
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-xl font-black tracking-wider text-white">DYZRUPT</h1>
    </div>
    <span class="text-xs font-mono text-zinc-500 border border-zinc-800 px-2 py-0.5 rounded-full">v2.5</span>
  </header>

  <main class="space-y-4 flex-1">

    <!-- Tabs Musa / Mi Voz -->
    <div class="flex bg-zinc-900/90 p-1 rounded-xl border border-zinc-800">
      <button class="flex-1 py-2 text-xs font-bold rounded-lg bg-zinc-800 text-emerald-400 border border-emerald-500/20 shadow-sm">Musa Audio</button>
      <button class="flex-1 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-zinc-200 transition-colors">Mi Voz</button>
    </div>

    <!-- 1. PROMPT -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-2">
      <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider">1. Prompt</label>
      <textarea rows="3" class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/50 resize-none" placeholder="Describe la mutación o idea sonora..."></textarea>
    </section>

    <!-- 2. MI LÍRICA -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-2">
      <label class="block text-xs font-bold text-zinc-300 uppercase tracking-wider">2. Mi Lírica</label>
      <textarea rows="4" class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/50 resize-none" placeholder="Escribe o pega tus letras aquí..."></textarea>
    </section>

    <!-- 3. ESTILOS -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <label class="text-xs font-bold text-zinc-300 uppercase tracking-wider">3. Estilos</label>
          <!-- Icono de Librería (III\) para abrir el Modal -->
          <button id="openLibraryBtn" class="text-zinc-400 hover:text-emerald-400 transition-colors p-1 rounded-lg bg-zinc-800/80">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </button>
        </div>
        <!-- Botón Aleatorio -->
        <button class="w-7 h-7 bg-zinc-800 hover:bg-zinc-700 active:scale-95 transition-all rounded-lg flex items-center justify-center text-xs">🎲</button>
      </div>

      <input type="text" class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/50" placeholder="Ej: Balada romántica, suave, piano...">

      <!-- Badges de Estilos Rápidos -->
      <div class="flex space-x-2 overflow-x-auto pb-1 text-xs no-scrollbar">
        <span class="px-3 py-1 bg-zinc-800/80 text-zinc-300 rounded-full border border-zinc-700/50 whitespace-nowrap cursor-pointer hover:border-emerald-500/50">Country</span>
        <span class="px-3 py-1 bg-zinc-800/80 text-zinc-300 rounded-full border border-zinc-700/50 whitespace-nowrap cursor-pointer hover:border-emerald-500/50">Folk</span>
        <span class="px-3 py-1 bg-zinc-800/80 text-zinc-300 rounded-full border border-zinc-700/50 whitespace-nowrap cursor-pointer hover:border-emerald-500/50">Rock</span>
        <span class="px-3 py-1 bg-zinc-800/80 text-zinc-300 rounded-full border border-zinc-700/50 whitespace-nowrap cursor-pointer hover:border-emerald-500/50">Pop</span>
      </div>
    </section>

    <!-- CONTROL UNIFICADO: MUTAR -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-2">
      <div class="flex justify-between items-center text-xs font-bold text-zinc-300">
        <span>MUTAR</span>
        <span id="mutarVal" class="text-emerald-400 font-mono">50%</span>
      </div>
      <input type="range" min="0" max="100" value="50" class="w-full accent-emerald-500 bg-zinc-950 h-2 rounded-lg cursor-pointer" oninput="document.getElementById('mutarVal').innerText = this.value + '%'">
    </section>

    <!-- ACCIÓN PRINCIPAL -->
    <button class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-base rounded-2xl shadow-lg shadow-emerald-500/20 active:scale-[0.98] transition-all tracking-wide uppercase">
      ⚡ Mutar Audio
    </button>

    <!-- HERRAMIENTAS AVANZADAS / HERRAMIENTAS DE VOZ -->
    <section class="border border-zinc-800/60 rounded-2xl p-3 bg-zinc-950/40">
      <div class="flex justify-between items-center cursor-pointer" onclick="document.getElementById('avanzadoContent').classList.toggle('hidden')">
        <span class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Ajustes Avanzados (Dyzvoice / Vocaldyz)</span>
        <span class="text-zinc-500 text-xs">▼</span>
      </div>
      <div id="avanzadoContent" class="hidden mt-3 pt-3 border-t border-zinc-800/60 space-y-3">
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Motor Vocal Standard</label>
          <select class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2 text-xs text-zinc-300">
            <option>Dyzvoice (Intermedio)</option>
            <option>Vocaldyz (Avanzado)</option>
          </select>
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL EMERGENTE DE LIBRERÍA DE ESTILOS -->
  <div id="libraryModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex flex-col justify-end sm:justify-center items-center p-0 sm:p-4">
    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-t-3xl sm:rounded-2xl p-5 space-y-4 max-h-[80vh] flex flex-col">
      <!-- Header Modal -->
      <div class="flex items-center justify-between pb-2 border-b border-zinc-800">
        <h3 class="text-base font-bold text-zinc-100">Más</h3>
        <button id="closeLibraryBtn" class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white">✕</button>
      </div>
      
      <!-- Pestañas (Solo Género y Estado de Ánimo) -->
      <div class="flex space-x-2 border-b border-zinc-800 pb-2">
        <button id="tabGenero" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-zinc-800 text-emerald-400 border border-emerald-500/30">Género</button>
        <button id="tabAnimo" class="px-4 py-1.5 rounded-full text-xs font-semibold text-zinc-400 hover:text-zinc-200">Estado de ánimo</button>
      </div>

      <!-- Lista de Selección -->
      <div class="overflow-y-auto flex-1 space-y-1 pr-1 text-sm text-zinc-300">
        <div id="listGenero" class="space-y-1">
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Hip Hop</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Jazz</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Reggae</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Pop</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>R&B</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>EDM</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Country</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Folk</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Rock</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Blues</span><span class="text-zinc-600">›</span></div>
        </div>
        <div id="listAnimo" class="space-y-1 hidden">
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Melancólico</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Energético</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Oscuro</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Relajante</span><span class="text-zinc-600">›</span></div>
          <div class="p-2.5 rounded-lg hover:bg-zinc-800/60 flex justify-between items-center cursor-pointer"><span>Eufórico</span><span class="text-zinc-600">›</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- LÓGICA DE INTERACCIÓN VANILLA JS -->
  <script>
    const openBtn = document.getElementById('openLibraryBtn');
    const closeBtn = document.getElementById('closeLibraryBtn');
    const modal = document.getElementById('libraryModal');
    const tabGenero = document.getElementById('tabGenero');
    const tabAnimo = document.getElementById('tabAnimo');
    const listGenero = document.getElementById('listGenero');
    const listAnimo = document.getElementById('listAnimo');

    if (openBtn && modal) {
      openBtn.addEventListener('click', () => modal.classList.remove('hidden'));
      closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
      modal.addEventListener('click', (e) => { if(e.target === modal) modal.classList.add('hidden'); });

      tabGenero.addEventListener('click', () => {
        tabGenero.className = "px-4 py-1.5 rounded-full text-xs font-semibold bg-zinc-800 text-emerald-400 border border-emerald-500/30";
        tabAnimo.className = "px-4 py-1.5 rounded-full text-xs font-semibold text-zinc-400 hover:text-zinc-200";
        listGenero.classList.remove('hidden');
        listAnimo.classList.add('hidden');
      });

      tabAnimo.addEventListener('click', () => {
        tabAnimo.className = "px-4 py-1.5 rounded-full text-xs font-semibold bg-zinc-800 text-emerald-400 border border-emerald-500/30";
        tabGenero.className = "px-4 py-1.5 rounded-full text-xs font-semibold text-zinc-400 hover:text-zinc-200";
        listAnimo.classList.remove('hidden');
        listGenero.classList.add('hidden');
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" class="h-full bg-black select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DYZRUPT - Audio Mutation Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
    
    .fab-gradient {
      background: linear-gradient(135deg, #06b6d4 0%, #d946ef 100%);
    }

    .tick-slider-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 28px;
      cursor: pointer;
      touch-action: none;
    }
    .tick-bar {
      width: 3px;
      height: 16px;
      border-radius: 2px;
      background-color: #27272a;
      transition: background-color 0.1s ease;
    }
    .tick-bar.active {
      background-color: #06b6d4;
      height: 20px;
    }
    .tick-bar.thumb {
      width: 6px;
      height: 24px;
      border-radius: 4px;
      background: linear-gradient(180deg, #d946ef 0%, #06b6d4 100%);
    }
  </style>
</head>
<body class="h-full bg-[#09090b] text-gray-200 font-sans flex flex-col justify-between overflow-hidden">

  <!-- TOP HEADER (Rendimiento ultra ligero: fondo sólido #09090b) -->
  <header class="sticky top-0 z-50 bg-[#09090b] border-b border-zinc-800/80 flex-none">
    <div class="px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <svg viewBox="0 0 100 40" class="w-10 h-10">
          <defs>
            <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#d946ef" />
              <stop offset="100%" stop-color="#06b6d4" />
            </linearGradient>
          </defs>
          <path d="M 5 20 L 15 20 L 25 35 L 40 5 L 55 35 L 70 10 L 80 25 L 90 20 L 95 20" 
                fill="none" stroke="url(#neonGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="flex flex-col">
          <span class="text-[15px] font-black tracking-widest text-white leading-none">DYZRUPT</span>
          <span class="text-[8px] tracking-[0.2em] text-zinc-400 uppercase font-bold mt-0.5">Audio Mutation Engine</span>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <button class="w-9 h-9 flex-shrink-0 rounded-full border-[1.5px] border-cyan-400 bg-cyan-950/40 flex items-center justify-center text-[10px] font-black text-cyan-300 active:scale-95 transition-transform">
          PRO
        </button>
        <div class="w-8 h-8 flex-shrink-0 rounded-full bg-zinc-800 border border-zinc-600 flex items-center justify-center overflow-hidden">
          <span class="text-xs font-bold text-zinc-300">DZ</span>
        </div>
        <button class="p-1 text-zinc-400 hover:text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>

    <!-- PESTAÑAS MUSA AUDIO / MI VOZ -->
    <div class="grid grid-cols-2 text-center text-sm font-semibold border-t border-zinc-800/60 relative">
      
      <!-- BOTÓN MUSA AUDIO -->
      <button id="btnMusa" class="py-2.5 text-cyan-400 border-b-[3px] border-cyan-400 bg-cyan-950/10 flex items-center justify-center space-x-1 relative transition-colors duration-150">
        <span>Musa audio</span>
        <svg class="w-4 h-4 transition-transform duration-200" id="arrowMusa" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </button>

      <!-- BOTÓN MI VOZ -->
      <button id="btnVoz" class="py-2.5 text-zinc-500 border-b-[3px] border-transparent flex items-center justify-center space-x-1 relative transition-colors duration-150">
        <span>Mi voz</span>
        <svg class="w-4 h-4 transition-transform duration-200" id="arrowVoz" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </button>

      <!-- MENÚ FLOTANTE DROPDOWN (Sólido y ligero) -->
      <div id="audioDropdown" class="hidden absolute top-full z-50 mt-1 w-52 bg-zinc-900 border border-zinc-700/90 rounded-2xl p-2 shadow-xl">
        <button class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-zinc-800 active:bg-zinc-700 text-zinc-200 text-sm font-bold transition-colors">
          <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
          <span>Subir archivo</span>
        </button>
        <button class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-zinc-800 active:bg-zinc-700 text-zinc-200 text-sm font-bold transition-colors">
          <svg class="w-5 h-5 text-fuchsia-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
          <span>Grabar</span>
        </button>
      </div>

    </div>
  </header>

  <!-- CANVAS PRINCIPAL -->
  <main class="flex-1 overflow-y-auto px-4 py-4 space-y-4 max-w-md mx-auto w-full pb-28">

    <!-- PROMPT -->
    <section class="bg-zinc-900 border border-zinc-800/60 rounded-2xl p-4">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-bold text-zinc-200">Prompt</span>
        <div class="flex items-center space-x-2">
          <button class="p-1 text-zinc-400 hover:text-white">🎲</button>
          <span class="text-[10px] font-bold text-zinc-400">V2.5</span>
        </div>
      </div>
      <textarea rows="3" class="w-full bg-transparent border-0 p-0 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:ring-0 resize-none" placeholder="Describe el estilo que quieres mutar..."></textarea>
      <div class="flex items-center justify-between mt-3 pt-2">
        <button class="p-1 text-zinc-400 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
        </button>
        <label class="flex items-center space-x-2 cursor-pointer">
          <input type="checkbox" class="form-checkbox w-4 h-4 text-cyan-500 rounded bg-zinc-950 border-zinc-700 focus:ring-0">
          <span class="text-xs font-medium text-zinc-400 hover:text-zinc-200">Solo Instrumental</span>
        </label>
      </div>
    </section>

    <!-- MI LÍRICA -->
    <section class="bg-zinc-900 border border-zinc-800/60 rounded-2xl p-4">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center space-x-1.5">
          <span class="text-sm font-bold text-zinc-200">Mi lírica</span>
          <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-4m0-4h.01"/></svg>
        </div>
        <button class="p-1 text-zinc-400 hover:text-white">🎲</button>
      </div>
      <textarea rows="3" class="w-full bg-transparent border-0 p-0 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:ring-0 resize-none" placeholder="Ingresa tu letra aquí..."></textarea>
      <div class="flex items-center justify-between mt-3 pt-2">
        <div class="flex items-center space-x-4 text-zinc-400">
          <button class="hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg></button>
          <button class="hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7"/></svg></button>
        </div>
        <button class="px-3 py-1 text-xs text-cyan-300 font-bold flex items-center space-x-1.5 active:scale-95 hover:text-cyan-200">
          <span>Optimizar</span>
          <span class="text-amber-300">✨ 0.5</span>
        </button>
        <button class="text-zinc-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></button>
      </div>
    </section>

    <!-- TÍTULO Y GÉNERO -->
    <section class="bg-zinc-900 border border-zinc-800/60 rounded-2xl p-4 space-y-5">
      <div>
        <div class="flex justify-between text-xs font-medium mb-1">
          <span class="text-zinc-400">Título (opcional)</span>
          <span class="text-zinc-600">0/80</span>
        </div>
        <input type="text" maxlength="80" class="w-full bg-transparent border-0 p-0 text-sm text-zinc-200 focus:outline-none focus:ring-0" placeholder="Nombre de la pista...">
      </div>
      <div>
        <span class="block text-xs font-medium text-zinc-400 mb-2">Género vocal</span>
        <div class="grid grid-cols-3 gap-2">
          <label class="flex items-center space-x-2 cursor-pointer text-xs font-semibold text-zinc-200">
            <input type="radio" name="vocal_gender" checked class="w-3.5 h-3.5 text-cyan-500 focus:ring-0 bg-transparent border-cyan-500">
            <span>Aleatorio</span>
          </label>
          <label class="flex items-center space-x-2 cursor-pointer text-xs text-zinc-400 hover:text-zinc-200">
            <input type="radio" name="vocal_gender" class="w-3.5 h-3.5 text-cyan-500 focus:ring-0 bg-transparent border-zinc-600">
            <span>Masculino</span>
          </label>
          <label class="flex items-center space-x-2 cursor-pointer text-xs text-zinc-400 hover:text-zinc-200">
            <input type="radio" name="vocal_gender" class="w-3.5 h-3.5 text-cyan-500 focus:ring-0 bg-transparent border-zinc-600">
            <span>Femenino</span>
          </label>
        </div>
      </div>
      <div class="flex items-center justify-between pt-1">
        <span class="text-sm text-zinc-300 font-bold">Número de canciones</span>
        <div class="flex items-center space-x-3">
          <button id="decSongs" class="text-zinc-400 hover:text-white font-bold text-lg px-2">-</button>
          <span id="songsCount" class="text-sm font-bold text-white w-4 text-center">2</span>
          <button id="incSongs" class="text-zinc-400 hover:text-white font-bold text-lg px-2">+</button>
        </div>
      </div>
    </section>

    <!-- AVANZADO (Cero blur, rendimiento extremo) -->
    <section class="bg-zinc-900 border border-zinc-800/60 rounded-2xl p-4">
      <button id="avanzadoToggle" class="w-full flex items-center justify-between text-left">
        <span class="text-sm font-bold text-zinc-200">Avanzado</span>
        <svg id="avanzadoArrow" class="w-5 h-5 text-zinc-400 transform transition-transform duration-200 rotate-180" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </button>

      <div id="avanzadoContent" class="mt-4 space-y-5">
        <div>
          <span class="block text-xs font-medium text-zinc-400 mb-1">Excluir estilos</span>
          <div class="relative flex items-center">
            <input type="text" class="w-full bg-transparent border-0 p-0 text-sm text-zinc-200 focus:outline-none focus:ring-0 pr-8" placeholder="ej. Jazz, Acústico...">
            <svg class="absolute right-0 w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
        </div>

        <!-- SLIDER RAREZA -->
        <div class="w-full">
          <div class="flex justify-between text-xs mb-2">
            <span class="text-zinc-300 font-medium">Rareza</span>
            <span id="valRareza" class="text-cyan-400 font-black tracking-wider">10%</span>
          </div>
          <div id="sliderRareza" class="tick-slider-container" data-val="10"></div>
        </div>

        <!-- SLIDER INFLUENCIA -->
        <div class="w-full">
          <div class="flex justify-between text-xs mb-2">
            <span class="text-zinc-300 font-medium">Influencia de estilo</span>
            <span id="valInfluencia" class="text-fuchsia-400 font-black tracking-wider">50%</span>
          </div>
          <div id="sliderInfluencia" class="tick-slider-container" data-val="50"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- FOOTER (Fondo sólido) -->
  <footer class="fixed bottom-0 left-0 right-0 z-50 bg-[#09090b] border-t border-zinc-800/80 px-6 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between relative">
      <button class="p-2 text-zinc-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></button>
      <button class="p-2 text-zinc-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" stroke-linejoin="round" d="M16.24 7.76l-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/></svg></button>
      <div class="relative -top-6">
        <button id="mutationFab" class="w-16 h-16 rounded-full fab-gradient p-[2px] active:scale-90 transition-transform flex items-center justify-center">
          <div class="w-full h-full rounded-full bg-black/50 flex items-center justify-center">
             <svg viewBox="0 0 100 40" class="w-8 h-8">
               <path d="M 10 20 L 25 20 L 35 35 L 50 5 L 65 35 L 75 10 L 85 25 L 90 20" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
             </svg>
          </div>
        </button>
      </div>
      <button class="p-2 text-zinc-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
      <button class="p-2 text-zinc-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>
    </div>
  </footer>

  <script>
    const btnMusa = document.getElementById('btnMusa');
    const btnVoz = document.getElementById('btnVoz');
    const dropdown = document.getElementById('audioDropdown');
    const arrowMusa = document.getElementById('arrowMusa');
    const arrowVoz = document.getElementById('arrowVoz');

    function setActiveTab(activeBtn, inactiveBtn) {
      activeBtn.className = "py-2.5 text-cyan-400 border-b-[3px] border-cyan-400 bg-cyan-950/10 flex items-center justify-center space-x-1 relative transition-colors duration-150";
      inactiveBtn.className = "py-2.5 text-zinc-500 border-b-[3px] border-transparent bg-transparent flex items-center justify-center space-x-1 relative transition-colors duration-150";
    }

    function toggleDropdown(targetBtn, leftPositionClass) {
      const isHidden = dropdown.classList.contains('hidden');
      
      if (targetBtn.id === 'btnMusa') {
        setActiveTab(btnMusa, btnVoz);
      } else {
        setActiveTab(btnVoz, btnMusa);
      }

      if (!isHidden && dropdown.dataset.activeBtn === targetBtn.id) {
        dropdown.classList.add('hidden');
        arrowMusa.classList.remove('rotate-180');
        arrowVoz.classList.remove('rotate-180');
        return;
      }

      dropdown.className = `absolute top-full z-50 mt-1 w-52 bg-zinc-900 border border-zinc-700/90 rounded-2xl p-2 shadow-xl ${leftPositionClass}`;
      dropdown.dataset.activeBtn = targetBtn.id;
      dropdown.classList.remove('hidden');

      if (targetBtn.id === 'btnMusa') {
        arrowMusa.classList.add('rotate-180');
        arrowVoz.classList.remove('rotate-180');
      } else {
        arrowVoz.classList.add('rotate-180');
        arrowMusa.classList.remove('rotate-180');
      }
    }

    btnMusa.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleDropdown(btnMusa, 'left-4');
    });

    btnVoz.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleDropdown(btnVoz, 'right-4');
    });

    document.addEventListener('click', () => {
      dropdown.classList.add('hidden');
      arrowMusa.classList.remove('rotate-180');
      arrowVoz.classList.remove('rotate-180');
    });

    const avanzadoToggle = document.getElementById('avanzadoToggle');
    const avanzadoContent = document.getElementById('avanzadoContent');
    const avanzadoArrow = document.getElementById('avanzadoArrow');

    avanzadoToggle.addEventListener('click', () => {
      avanzadoContent.classList.toggle('hidden');
      avanzadoArrow.classList.toggle('rotate-180');
    });

    let songs = 2;
    const songsCountEl = document.getElementById('songsCount');
    document.getElementById('incSongs').addEventListener('click', () => {
      if(songs < 10) { songs++; songsCountEl.textContent = songs; }
    });
    document.getElementById('decSongs').addEventListener('click', () => {
      if(songs > 1) { songs--; songsCountEl.textContent = songs; }
    });

    function initTickSlider(containerId, valueLabelId, initialVal, activeColorClass) {
      const container = document.getElementById(containerId);
      const label = document.getElementById(valueLabelId);
      const totalTicks = 16;

      function render(percent) {
        container.innerHTML = '';
        const activeCount = Math.round((percent / 100) * (totalTicks - 1));
        label.textContent = `${percent}%`;
        container.setAttribute('data-val', percent);

        for (let i = 0; i < totalTicks; i++) {
          const tick = document.createElement('div');
          if (i === activeCount) {
            tick.className = 'tick-bar thumb';
          } else if (i < activeCount) {
            tick.className = `tick-bar active ${activeColorClass}`;
          } else {
            tick.className = 'tick-bar';
          }
          container.appendChild(tick);
        }
      }

      function updateFromPointer(e) {
        const rect = container.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let offsetX = clientX - rect.left;
        offsetX = Math.max(0, Math.min(offsetX, rect.width));
        let percent = Math.round((offsetX / rect.width) * 100);
        percent = Math.round(percent / 5) * 5;
        render(percent);
      }

      let isDragging = false;
      container.addEventListener('pointerdown', (e) => {
        isDragging = true;
        container.setPointerCapture(e.pointerId);
        updateFromPointer(e);
      });
      container.addEventListener('pointermove', (e) => {
        if (isDragging) updateFromPointer(e);
      });
      container.addEventListener('pointerup', (e) => {
        isDragging = false;
      });

      render(initialVal);
    }

    initTickSlider('sliderRareza', 'valRareza', 10, 'bg-cyan-400');
    initTickSlider('sliderInfluencia', 'valInfluencia', 50, 'bg-fuchsia-400');
  </script>
</body>
</html>
